# Example nginx server block for the Jahrestage app.
# Adjust server_name, root path and the upstream port to match your setup.
#
# If an outer reverse proxy already terminates TLS and forwards to this
# nginx, this block can listen on plain HTTP (e.g. 127.0.0.1:8090) — just
# make sure the outer proxy forwards the Host header and, ideally,
# X-Forwarded-Proto so links/redirects behave correctly.

server {
    listen 80;
    server_name jahrestage.example.com;

    root /var/www/jahrestage/dist;
    index index.html;

    # Service worker must be served from the root with no long-lived cache,
    # otherwise browsers may keep an outdated version around.
    location = /sw.js {
        add_header Cache-Control "no-cache";
        try_files $uri =404;
    }

    location = /manifest.json {
        try_files $uri =404;
    }

    # Static frontend (single page, no client-side routing needed here)
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Backend API — proxied to the pm2-managed Node process
    location /api/ {
        proxy_pass http://127.0.0.1:3001/api/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
